[project]
name = "nq-bot-v3"
version = "0.1.0"
description = "NQ futures v3 — signal logger, data pipeline, model training."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# model training + ONNX export:  uv sync --extra model
model = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "onnxmltools>=1.12",
    "onnxruntime>=1.17",
]

[tool.uv]
package = false
